<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DriveShield AI - Phone Sensor</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-dark text-white">

<div class="container text-center mt-5">

    <h2>📱 DriveShield AI</h2>

    <h4 class="mt-4">Phone Sensor</h4>

    <p id="status" class="text-warning">
        Press Start Sensors
    </p>

    <hr>

    <h5>Accelerometer</h5>

    <p>X : <span id="x">0</span></p>
    <p>Y : <span id="y">0</span></p>
    <p>Z : <span id="z">0</span></p>

    <hr>

    <h5>GPS</h5>

    <p id="gps">Waiting...</p>

    <button
        class="btn btn-success"
        onclick="startSensors()">

        Start Sensors

    </button>

</div>

<script>

let latitude = 0;
let longitude = 0;

function startSensors() {

    document.getElementById("status").innerHTML =
    "Checking sensor support...";

    // GPS

    if (navigator.geolocation) {

        navigator.geolocation.watchPosition(

            function(position){

                latitude = position.coords.latitude;
                longitude = position.coords.longitude;

                document.getElementById("gps").innerHTML =
                latitude + " , " + longitude;

            },

            function(error){

                document.getElementById("gps").innerHTML =
                "GPS Permission Denied";

            },

            {
                enableHighAccuracy:true
            }

        );

    }

    // Motion Sensor

    if (typeof DeviceMotionEvent === "undefined") {

        document.getElementById("status").innerHTML =
        "Device Motion NOT Supported";

        return;
    }

    // iPhone permission

    if (typeof DeviceMotionEvent.requestPermission === "function") {

        DeviceMotionEvent.requestPermission()

        .then(function(response){

            if(response==="granted"){

                document.getElementById("status").innerHTML =
                "Sensors Running";

                startMotion();

            }
            else{

                document.getElementById("status").innerHTML =
                "Motion Permission Denied";

            }

        })

        .catch(function(){

            document.getElementById("status").innerHTML =
            "Permission Error";

        });

    }

    // Android

    else{

        document.getElementById("status").innerHTML =
        "Sensors Running";

        startMotion();

    }

}

function startMotion(){

    window.addEventListener(

        "devicemotion",

        function(event){

            let x = event.accelerationIncludingGravity?.x || 0;
            let y = event.accelerationIncludingGravity?.y || 0;
            let z = event.accelerationIncludingGravity?.z || 0;

            document.getElementById("x").innerHTML =
            x.toFixed(2);

            document.getElementById("y").innerHTML =
            y.toFixed(2);

            document.getElementById("z").innerHTML =
            z.toFixed(2);

            let magnitude =
            Math.sqrt(x*x + y*y + z*z);

            if(magnitude > 35){

                fetch("/accident",{

                    method:"POST",

                    headers:{
                        "Content-Type":"application/json"
                    },

                    body:JSON.stringify({

                        x:x,
                        y:y,
                        z:z,
                        latitude:latitude,
                        longitude:longitude

                    })

                });

                alert("Possible Accident Detected");

            }

        }

    );

}

</script>

</body>

</html>
