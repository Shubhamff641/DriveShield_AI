<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Live GPS - DriveShield AI</title>
    <link
    rel="icon"
    type="image/png"
    href="{{ url_for('static', filename='images/driveshield-logo.png') }}"
>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-info shadow">
    <div class="container-fluid">

        <span class="navbar-brand fw-bold">
            📍 DriveShield AI - Live GPS
        </span>

        <div>
            <a
                href="{{ url_for('dashboard.dashboard_page') }}"
                class="btn btn-light me-2"
            >
                Dashboard
            </a>

            <a
                href="{{ url_for('auth.logout') }}"
                class="btn btn-dark"
            >
                Logout
            </a>
        </div>

    </div>
</nav>

<div class="container mt-5">

    <div class="card shadow border-0">

        <div class="card-body p-4">

            <div class="text-center mb-4">

                <h2>📍 Current Location</h2>

                <p class="text-muted">
                    Allow location permission to detect your live GPS position.
                </p>

            </div>

            <div
                id="statusMessage"
                class="alert alert-info text-center"
            >
                Click the button below to get your current location.
            </div>

            <div class="row text-center mb-4">

                <div class="col-md-4 mb-3">

                    <div class="card h-100 border-primary">

                        <div class="card-body">

                            <h5>Latitude</h5>

                            <h4
                                id="latitude"
                                class="text-primary"
                            >
                                --
                            </h4>

                        </div>

                    </div>

                </div>

                <div class="col-md-4 mb-3">

                    <div class="card h-100 border-success">

                        <div class="card-body">

                            <h5>Longitude</h5>

                            <h4
                                id="longitude"
                                class="text-success"
                            >
                                --
                            </h4>

                        </div>

                    </div>

                </div>

                <div class="col-md-4 mb-3">

                    <div class="card h-100 border-warning">

                        <div class="card-body">

                            <h5>Accuracy</h5>

                            <h4
                                id="accuracy"
                                class="text-warning"
                            >
                                --
                            </h4>

                        </div>

                    </div>

                </div>

            </div>

            <div class="text-center">

                <button
                    id="getLocationButton"
                    class="btn btn-info btn-lg me-2"
                    onclick="getLocation()"
                >
                    Get Current Location
                </button>

                <a
                    id="mapsLink"
                    href="#"
                    target="_blank"
                    class="btn btn-success btn-lg d-none"
                >
                    Open in Google Maps
                </a>

            </div>

        </div>

    </div>

</div>

<script>

function getLocation() {

    const statusMessage = document.getElementById("statusMessage");
    const locationButton = document.getElementById("getLocationButton");

    if (!navigator.geolocation) {

        statusMessage.className = "alert alert-danger text-center";
        statusMessage.innerText =
            "Geolocation is not supported by this browser.";

        return;
    }

    statusMessage.className = "alert alert-warning text-center";
    statusMessage.innerText = "Getting your location...";

    locationButton.disabled = true;
    locationButton.innerText = "Detecting...";

    navigator.geolocation.getCurrentPosition(
        showPosition,
        showError,
        {
            enableHighAccuracy: true,
            timeout: 15000,
            maximumAge: 0
        }
    );
}


function showPosition(position) {

    const latitude = position.coords.latitude;
    const longitude = position.coords.longitude;
    const accuracy = position.coords.accuracy;

    document.getElementById("latitude").innerText =
        latitude.toFixed(7);

    document.getElementById("longitude").innerText =
        longitude.toFixed(7);

    document.getElementById("accuracy").innerText =
        accuracy.toFixed(2) + " meters";

    const mapsLink = document.getElementById("mapsLink");

    mapsLink.href =
        "https://www.google.com/maps?q=" +
        latitude +
        "," +
        longitude;

    mapsLink.classList.remove("d-none");

    const statusMessage =
        document.getElementById("statusMessage");

    statusMessage.className =
        "alert alert-success text-center";

    statusMessage.innerText =
        "Location detected successfully.";

    const locationButton =
        document.getElementById("getLocationButton");

    locationButton.disabled = false;
    locationButton.innerText = "Refresh Location";
}


function showError(error) {

    const statusMessage =
        document.getElementById("statusMessage");

    let errorMessage = "";

    switch (error.code) {

        case error.PERMISSION_DENIED:
            errorMessage =
                "Location permission denied. Please allow location access.";
            break;

        case error.POSITION_UNAVAILABLE:
            errorMessage =
                "Location information is unavailable.";
            break;

        case error.TIMEOUT:
            errorMessage =
                "Location request timed out. Please try again.";
            break;

        default:
            errorMessage =
                "An unknown location error occurred.";
    }

    statusMessage.className =
        "alert alert-danger text-center";

    statusMessage.innerText = errorMessage;

    const locationButton =
        document.getElementById("getLocationButton");

    locationButton.disabled = false;
    locationButton.innerText = "Try Again";
}

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
