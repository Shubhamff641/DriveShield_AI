<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Emergency Contact</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<nav class="navbar navbar-dark bg-warning">

    <div class="container-fluid">

        <a class="navbar-brand" href="/dashboard">
            🚗 DriveShield AI
        </a>

        <a href="/emergency" class="btn btn-light">
            Back
        </a>

    </div>

</nav>

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card shadow">

                <div class="card-header bg-warning">

                    <h3>Edit Emergency Contact</h3>

                </div>

                <div class="card-body">

                    <form method="POST">

                        <div class="mb-3">

                            <label class="form-label">
                                Contact Name
                            </label>

                            <input
                                type="text"
                                name="contact_name"
                                class="form-control"
                                value="{{ contact.contact_name }}"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Relationship
                            </label>

                            <select
                                name="relationship"
                                class="form-select">

                                <option {% if contact.relationship=="Father" %}selected{% endif %}>Father</option>
                                <option {% if contact.relationship=="Mother" %}selected{% endif %}>Mother</option>
                                <option {% if contact.relationship=="Brother" %}selected{% endif %}>Brother</option>
                                <option {% if contact.relationship=="Sister" %}selected{% endif %}>Sister</option>
                                <option {% if contact.relationship=="Friend" %}selected{% endif %}>Friend</option>
                                <option {% if contact.relationship=="Spouse" %}selected{% endif %}>Spouse</option>
                                <option {% if contact.relationship=="Other" %}selected{% endif %}>Other</option>

                            </select>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Phone Number
                            </label>

                            <input
                                type="text"
                                name="phone"
                                class="form-control"
                                value="{{ contact.contact_phone }}"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Email Address
                            </label>

                            <input
                                type="email"
                                name="contact_email"
                                class="form-control"
                                value="{{ contact.contact_email }}"
                                required>

                        </div>

                        <button
                            type="submit"
                            class="btn btn-warning">

                            Update Contact

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
